<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    (function() {
      var sections = ['download', 'preview', 'changelog', 'support', 'purchase'];
      var path = window.location.pathname.toLowerCase().replace(/\/$/, "").replace(/^\//, "");
      var view = "";
      for (var i = 0; i < sections.length; i++) {
        if (path === sections[i] || path.startsWith(sections[i] + "/")) {
          view = sections[i];
          break;
        }
      }
      window.location.replace(view ? ("/?view=" + view) : "/");
    })();
  </script>
</head>
<body></body>
</html>
